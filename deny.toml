[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
]


[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "We don't really use RSA" },
  # crypto-bigint 0.5 only comes in through openidconnect's p256/p384, which only verify ID token signatures with public keys.
  # The 0.7 line (web-push signs with our VAPID key) is kept at a fixed version by [bans].
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only verifies signatures with public keys" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is only used by the askama proc-macro at build time" },
]

[bans]
deny = [
    { crate = "openssl-sys", reason = "If we need openssl we need to watch out with linking" },
    { crate = "crypto-bigint:>=0.6, <0.7.6", reason = "RUSTSEC-2026-0387, ignored above for the 0.5 line only" },
]
