[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "MPL-2.0",
  "AGPL-3.0-or-later",
  "GPL-3.0-or-later",
]


[advisories]
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "We don't really use RSA" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml is only used by the askama proc-macro at build time" },
  # sqlx-sqlite 0.9.0 caps libsqlite3-sys below 0.38 (the fix is in 0.39); sqlx main lifts the cap but is unreleased.
  # The advisory needs a database plus -wal file written by a less trusted party; rustical only opens its own
  # configured db_url (and :memory:), never a user-supplied database file. Drop this once sqlx >= 0.9.1 is out.
  { id = "RUSTSEC-2026-0459", reason = "sqlx 0.9.0 caps libsqlite3-sys <0.38; only our own DB+WAL is opened; drop on sqlx >= 0.9.1" },
  # chrono and chrono-tz are declared unmaintained without a successor release; rustical, sqlx, openidconnect and
  # web-push all build on them, so there is nothing to upgrade to. Neither advisory is a vulnerability; a real one
  # gets its own RUSTSEC id and still fails. Drop once upstream moves off chrono (e.g. to jiff).
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no successor; used throughout rustical and its deps; not a vulnerability" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no successor; used throughout rustical and its deps; not a vulnerability" },
]

[bans]
deny = [
    { crate = "openssl-sys", reason = "If we need openssl we need to watch out with linking" },
    { crate = "crypto-bigint:>=0.6, <0.7.6", reason = "RUSTSEC-2026-0387; the 0.7 line signs with our VAPID key (web-push)" },
]
